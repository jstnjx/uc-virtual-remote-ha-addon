name: UC Virtual Remote
version: "0.14.1"
slug: uc_virtual_remote_arm64
description: >-
  UC Virtual Remote packaged for Home Assistant on ARM64 and AMD64. Normal ARM64
  UC integration tarballs run natively on ARM64 and through scoped emulation on AMD64;
  external integrations run in the internal Docker runtime.
url: https://github.com/jstnjx/uc-virtual-remote-ha-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
host_dbus: true
udev: true
full_access: true
apparmor: false
ingress: true
ingress_port: 11090
ingress_entry: /configurator/
panel_icon: mdi:remote
panel_title: UC Virtual Remote
webui: http://[HOST]:[PORT:11090]/configurator/
watchdog: http://[HOST]:11090/health
backup: cold
stage: stable
options:
  pin: "1234"
  remote_name: Virtual Remote 3
  log_level: info
  dind_storage_driver: overlay2
schema:
  pin: "match(^[0-9]{4}$)"
  remote_name: "str(1,64)"
  log_level: "list(debug|info|warn|error)"
  dind_storage_driver: "list(overlay2|vfs)"
  github_token: "password?"
