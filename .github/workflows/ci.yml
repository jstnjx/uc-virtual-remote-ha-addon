name: Validate add-on

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' uc_virtual_remote/config.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require latest upstream version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/jstnjx/uc-virtual-remote-arm64/releases/latest)"
          TAG="$(jq -r '.tag_name // empty' <<<"$RELEASE_JSON")"
          test -n "$TAG"

          LATEST="${TAG#v}"
          VERSION_JSON="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/jstnjx/uc-virtual-remote-arm64/contents/VERSION?ref=${TAG}")"
          UPSTREAM_VERSION="$(jq -r '.content' <<<"$VERSION_JSON" | tr -d '\n' | base64 -d | tr -d '\r\n')"

          test "$LATEST" = "$UPSTREAM_VERSION"
          if [[ "$VERSION" != "$UPSTREAM_VERSION" ]]; then
            echo "Add-on version $VERSION does not match latest upstream version $UPSTREAM_VERSION." >&2
            exit 1
          fi
          echo "Add-on version mirrors latest upstream release: $UPSTREAM_VERSION"

      - name: Validate Home Assistant descriptor
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name:[[:space:]]*.+' repository.yaml
          grep -Eq '^url:[[:space:]]*https://github.com/jstnjx/uc-virtual-remote-ha-addon$' repository.yaml
          grep -Eq '^maintainer:[[:space:]]*.+' repository.yaml
          grep -Eq '^name:[[:space:]]*.+' uc_virtual_remote/config.yaml
          grep -Eq '^version:[[:space:]]*"?[^"[:space:]]+"?[[:space:]]*$' uc_virtual_remote/config.yaml
          grep -Eq '^slug:[[:space:]]*[a-z0-9_-]+$' uc_virtual_remote/config.yaml
          grep -Fq '  - aarch64' uc_virtual_remote/config.yaml
          grep -Fq '  - amd64' uc_virtual_remote/config.yaml
          grep -Fq 'privileged:' uc_virtual_remote/config.yaml
          grep -Fq '  - SYS_ADMIN' uc_virtual_remote/config.yaml
          grep -Fq 'full_access: true' uc_virtual_remote/config.yaml
          grep -Fq 'hassio_api: true' uc_virtual_remote/config.yaml
          grep -Fq 'homeassistant_api: true' uc_virtual_remote/config.yaml
          grep -Fq 'host_network: true' uc_virtual_remote/config.yaml
          grep -Fq 'ingress: true' uc_virtual_remote/config.yaml
          grep -Eq '^webui:[[:space:]]*(https?|\[PROTO:[A-Za-z0-9_]+\])://\[HOST\]:\[PORT:[0-9]+\]/?.*$' uc_virtual_remote/config.yaml
          grep -Eq '^watchdog:[[:space:]]*(https?|tcp)://\[HOST\]:(\[PORT:[0-9]+\]|[0-9]+)(/.*)?$' uc_virtual_remote/config.yaml

      - name: Validate wrapper and upstream contract
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash -n uc_virtual_remote/run.sh
          grep -Fq 'FROM ghcr.io/jstnjx/uc-virtual-remote-arm64:${BUILD_VERSION}' uc_virtual_remote/Dockerfile
          VERSION_JSON="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/jstnjx/uc-virtual-remote-arm64/contents/VERSION?ref=v${VERSION}")"
          UPSTREAM_VERSION="$(jq -r '.content' <<<"$VERSION_JSON" | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$UPSTREAM_VERSION" = "$VERSION"

      - name: Require public upstream multiarch image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/jstnjx/uc-virtual-remote-arm64:${VERSION}"
          MANIFEST="$(docker manifest inspect "$IMAGE")"
          jq -e '
            ([.manifests[]?.platform.architecture] | index("amd64")) != null
            and ([.manifests[]?.platform.architecture] | index("arm64")) != null
          ' <<<"$MANIFEST" >/dev/null
          echo "Upstream amd64+arm64 image is anonymously pullable: $IMAGE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 Home Assistant wrapper
        uses: docker/build-push-action@v7
        with:
          context: ./uc_virtual_remote
          file: ./uc_virtual_remote/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          tags: uc-virtual-remote-ha-addon:ci-amd64
          cache-from: type=gha,scope=addon-amd64
          cache-to: type=gha,mode=max,scope=addon-amd64

      - name: Build ARM64 Home Assistant wrapper
        uses: docker/build-push-action@v7
        with:
          context: ./uc_virtual_remote
          file: ./uc_virtual_remote/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
          tags: uc-virtual-remote-ha-addon:ci-aarch64
          cache-from: type=gha,scope=addon-aarch64
          cache-to: type=gha,mode=max,scope=addon-aarch64
