name: Verify v0.14.6 image once

on:
  push:
    branches:
      - verify/v0.14.6-image

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify public multiarch image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.6'
          MANIFEST="$(docker manifest inspect "$IMAGE")"
          jq -e '
            ([.manifests[]?.platform.architecture] | index("amd64")) != null
            and ([.manifests[]?.platform.architecture] | index("arm64")) != null
          ' <<<"$MANIFEST" >/dev/null

      - name: Remove one-shot verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/verify-v0146-image-once.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Remove temporary v0.14.6 image verifier' \
            -f sha="$sha" \
            -f branch=main >/dev/null
